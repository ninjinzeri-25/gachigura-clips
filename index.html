<style>
:root{--yellow:#ffda24;--yellow2:#ffef92;--black:#171719;--coal:#252528;--ink:#f8f6ed;--muted:#b9b7ac;--stroke:#45443f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#181819;font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 15%,#45401e 0,transparent 32%),repeating-linear-gradient(135deg,transparent 0 48px,#ffffff06 49px 50px);opacity:.38}
a{color:inherit}.hero{position:relative;overflow:hidden;min-height:320px;background:var(--yellow);color:var(--black);border-bottom:8px solid #0f0f10;padding:60px 20px 48px;text-align:center;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(-15deg,transparent 0 46px,#00000009 47px 49px),radial-gradient(#0000001d 1.3px,transparent 1.5px);background-size:auto,13px 13px;opacity:.65}
.hero:after{content:"THE YELLOW ORDER";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-8deg);font:900 clamp(80px,15vw,220px)/.85 'Barlow Condensed',sans-serif;white-space:nowrap;letter-spacing:-.04em;color:#0000000c;z-index:-1}
.eyebrow{display:inline-block;font:800 14px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.18em;background:#1a1a1a;color:var(--yellow);padding:10px 17px;transform:rotate(-2deg);box-shadow:5px 5px 0 #ffffff99}
h1{margin:24px auto 10px;max-width:1100px;white-space:nowrap;font:900 clamp(1.9rem,8.2vw,7.8rem)/.95 'Barlow Condensed','Noto Sans JP',sans-serif;letter-spacing:-.015em;text-transform:uppercase;text-shadow:5px 5px 0 #ffffffad;overflow-wrap:anywhere}
.subtitle{font-weight:900;font-size:clamp(1.05rem,2.7vw,1.55rem);letter-spacing:.06em;margin:20px 0 0}.tag{display:inline-block;margin-top:17px;background:#1b1b1b;color:var(--yellow);font-weight:900;font-size:.92rem;padding:4px 20px;transform:rotate(2deg);border:2px solid #1b1b1b}
.sticker{position:absolute;pointer-events:none;font:900 1.1rem 'Barlow Condensed',sans-serif;letter-spacing:.12em;border:3px solid #181818;padding:7px 13px}.s1{left:6%;top:24%;transform:rotate(-17deg)}.s2{right:6%;bottom:19%;transform:rotate(13deg)}
.toolbar-wrap{position:sticky;top:0;z-index:10;background:#1b1b1bef;border-bottom:2px solid #514a27;backdrop-filter:blur(12px)}.toolbar{max-width:1220px;margin:auto;padding:17px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.searchbox{position:relative;flex:1;min-width:230px}.searchbox:before{content:"⌕";position:absolute;top:50%;left:15px;transform:translateY(-53%);color:#242424;font-size:29px;font-weight:900;pointer-events:none}.searchbox input{width:100%;border:3px solid #101010;border-radius:3px;padding:13px 15px 13px 48px;background:#f5f3e9;color:#161616;font:700 1rem 'Noto Sans JP',sans-serif;outline:none;box-shadow:5px 5px 0 #655b2a}.searchbox input:focus{border-color:var(--yellow);box-shadow:0 0 0 2px #fff,5px 5px 0 #655b2a}.count{white-space:nowrap;color:var(--yellow);font:900 1.4rem 'Barlow Condensed','Noto Sans JP',sans-serif;letter-spacing:.06em}.count small{font-size:.75rem;color:#d3d0c5;margin-left:5px}
main{max-width:1220px;margin:auto;padding:42px 20px 90px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:27px}.sectionhead h2{font:900 clamp(1.7rem,4vw,2.6rem) 'Barlow Condensed',sans-serif;letter-spacing:.08em;margin:0;color:var(--yellow)}.sectionhead span{font-size:.8rem;color:#b9b7ac;letter-spacing:.12em}.sectionhead h2:before{content:"// ";color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.card{min-width:0;background:#29292b;border:2px solid #4b4941;box-shadow:8px 8px 0 #0e0e0f;display:flex;flex-direction:column;overflow:hidden;animation:rise .55s both;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-6px) rotate(-.25deg);box-shadow:10px 14px 0 #0e0e0f}.card-top{min-height:122px;padding:19px 18px 16px;border-bottom:5px solid var(--yellow);background:linear-gradient(135deg,#323235,#222225)}.card-no{display:inline-block;background:var(--yellow);color:#111;padding:3px 12px;font:900 1.18rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;transform:rotate(-2deg)}.card-title{font-size:1.04rem;font-weight:900;line-height:1.65;margin:10px 0 0;overflow-wrap:anywhere}.embed{padding:15px 12px 12px;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:flex-start;min-height:425px}.tweet-wrap{width:100%;max-width:550px;min-height:345px;overflow:hidden}.twitter-tweet{margin:0 auto!important}.post-link{margin-top:auto;display:block;text-align:center;text-decoration:none;color:#111;background:var(--yellow);font-size:.86rem;font-weight:900;padding:11px 14px;width:100%;border:2px solid #141414;transition:background .2s}.post-link:hover{background:#fff0a3}.empty{grid-column:1/-1;text-align:center;padding:65px 15px;color:#ddd;background:#29292b;border:2px dashed #6c643d}.empty strong{display:block;color:var(--yellow);font-size:1.3rem;margin-bottom:8px}
footer{border-top:5px solid var(--yellow);padding:28px 20px;text-align:center;color:#a9a79c;font-size:.82rem;background:#101011}footer strong{color:var(--yellow)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.hero{min-height:255px;padding:48px 14px 38px}h1{font-size:clamp(1.65rem,8.1vw,3.4rem)}.sticker{display:none}.toolbar{padding:14px 16px}.grid{grid-template-columns:1fr;gap:24px}main{padding:28px 16px 70px}.card-top{min-height:105px}.embed{min-height:380px}.sectionhead span{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function escapeHtml(value){return String(value).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function render(items){
  shown.textContent=items.length;
  if(!items.length){list.innerHTML='<div class="empty"><strong>NO CLIPS FOUND</strong>該当するクリップがありません。別のキーワードを試してね。</div>';return;}
  list.innerHTML=items.map((v,i)=>`<article class="card" style="animation-delay:${Math.min(i*35,600)}ms"><div class="card-top"><span class="card-no">CLIP ${String(v.no).padStart(2,'0')}</span><h3 class="card-title">${escapeHtml(v.title)}</h3></div><div class="embed"><div class="tweet-wrap"><blockquote class="twitter-tweet" data-dnt="true" data-theme="light" data-align="center" data-conversation="none"><a href="${v.url}">Xで投稿を見る</a></blockquote></div><a class="post-link" href="${v.url}" target="_blank" rel="noopener noreferrer">Xで投稿を見る ↗</a></div></article>`).join('');
  if(window.twttr?.widgets?.load){window.twttr.widgets.load(list);}
}
search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase();render(q?videos.filter(v=>(v.title+' '+(searchKeywords[v.no]||[]).join(' ')).toLocaleLowerCase().includes(q)):videos)});
